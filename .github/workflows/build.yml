name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.11.1" }
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          gradle :app:testReleaseUnitTest :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          { grep -E "^e: |error:|AssertionError|Test.*FAILED" build.log; grep -A6 "What went wrong" build.log; tail -15 build.log; } | head -45 | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Publish APK to the "apk" branch
        run: |
          mkdir out && cp app/build/outputs/apk/release/app-release.apk out/Kairos.apk
          cd out && git init -q -b apk
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add Kairos.apk && git commit -q -m "build ${{ github.run_number }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
